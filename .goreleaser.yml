version: 2

project_name: zzz

builds:
  - main: ./main.go
    ldflags:
      - -s -w -X 'github.com/sohaha/zzz/util.BuildTime={{.Date}}' -X 'github.com/sohaha/zzz/util.Version={{.Version}}'
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
      - '386'
    ignore:
      - goos: darwin
        goarch: '386'
    env:
      - CGO_ENABLED=0

archives:
  - name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- .Os }}_{{ .Arch }}
    formats: [tar.gz]

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  # skip: true
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - (?i)--
